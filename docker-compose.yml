services:
  extract:
    build: .
    # Usage: docker compose run --rm extract extract --input /data/raw.txt --output /data/out.jsonl
    # Override CMD at runtime — image entrypoint is already `dih-engine`
    volumes:
      - ./data:/data
    environment:
      DEE_PAUSE_THRESHOLD: "80.0"
      DEE_DISK_THRESHOLD: "95.0"

  recon:
    build: .
    # Usage: docker compose run --rm recon recon --input /data/urls.csv --output /data/plan.csv
    volumes:
      - ./data:/data
    environment:
      SEER_REQUEST_TIMEOUT: "10"
      SEER_SAMPLE_SIZE: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Usage: DIH_API_KEY=your-secret docker compose up api
    # Then: curl -H "X-API-Key: your-secret" -X POST localhost:8000/sanitize \
    #            -H "Content-Type: application/json" -d '{"line":"O01234 ITEM 14,50"}'
    ports:
      - "8000:8000"
    environment:
      # Fail-closed: the service returns 503 on data routes until this is set.
      # Never commit a real key -- inject it from the shell or a secrets manager.
      DIH_API_KEY: "${DIH_API_KEY:?set DIH_API_KEY before starting the api service}"
      DEE_PAUSE_THRESHOLD: "80.0"
      DEE_DISK_THRESHOLD: "95.0"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    # Usage: docker compose up -d flaresolverr
    # Then set FLARE_SOLVER_URL=http://localhost:8191/v1 in .env
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: "info"
    restart: unless-stopped
