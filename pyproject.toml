[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dih-engine"
version = "0.3.0"
description = "Deterministic data extraction and OCR sanitization engine for unstructured text streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dih_engine --cov-report=term-missing -v"

[tool.setuptools.packages.find]
where = ["src"]
