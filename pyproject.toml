[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dih-engine"
version = "4.1.0"
description = "Deterministic data extraction and OCR sanitization engine for unstructured text streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
tls     = ["curl-cffi>=0.6"]
browser = ["playwright>=1.40"]
proxy   = ["requests[socks]"]
full    = ["curl-cffi>=0.6", "playwright>=1.40", "requests[socks]"]

[project.scripts]
dih-engine = "dih_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/dih_engine --cov-report=term-missing -v"

[tool.setuptools.packages.find]
where = ["src"]
